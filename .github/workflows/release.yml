name: build-and-release
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: python-dist, path: dist/* }

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/build-deb.sh
      - run: dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with: { name: snap, path: "${{ steps.build.outputs.snap }}" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, deb, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

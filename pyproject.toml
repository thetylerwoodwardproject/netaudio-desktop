[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudio-desktop"
dynamic = ["version"]
description = "Native GTK4/libadwaita desktop front end for the NetAudio Dante controller daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyGObject>=3.46"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Topic :: Multimedia :: Sound/Audio",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
netaudio-desktop = "netaudio_desktop.app:main"

[tool.setuptools]
packages = ["netaudio_desktop"]

[tool.setuptools.dynamic]
version = { attr = "netaudio_desktop.__version__" }

name: netaudio-desktop
title: NetAudio Desktop
base: core24
adopt-info: app
summary: Discover and route Dante audio devices
description: |
  Native GTK4/libadwaita front end for the NetAudio daemon. Browse Dante
  devices, route channels in a matrix, rename devices and channels, set
  sample rates and identify hardware. Bundles the public-domain (Unlicense) netaudio
  daemon. Unofficial; not affiliated with Audinate.
license: MIT
icon: data/app.netaudio.Desktop.svg
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  netaudio-desktop:
    command: bin/netaudio-desktop
    extensions: [gnome]
    desktop: usr/share/applications/app.netaudio.Desktop.desktop
    plugs: [network, network-bind, network-observe, network-control]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/girepository-1.0:$GI_TYPELIB_PATH
      NETAUDIO_DAEMON_BIN: $SNAP/usr/lib/netaudio/netaudio-daemon

parts:
  app:
    plugin: nil
    source: .
    build-packages: [python3]
    stage-packages: [python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1]
    override-build: |
      set -eu
      craftctl set version="$(python3 -c "import re;print(re.search(r'\"([^\"]+)\"',open('netaudio_desktop/__init__.py').read()).group(1))")"
      install -d "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages" "$CRAFT_PART_INSTALL/bin" \
        "$CRAFT_PART_INSTALL/usr/share/applications" "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo"
      cp -r netaudio_desktop "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/"
      printf '#!/bin/sh\nexec python3 -m netaudio_desktop "$@"\n' > "$CRAFT_PART_INSTALL/bin/netaudio-desktop"
      chmod 755 "$CRAFT_PART_INSTALL/bin/netaudio-desktop"
      sed 's|@EXEC@|netaudio-desktop|' data/app.netaudio.Desktop.desktop \
        > "$CRAFT_PART_INSTALL/usr/share/applications/app.netaudio.Desktop.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/app.netaudio.Desktop.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/app.netaudio.Desktop.desktop"
      install -m644 data/app.netaudio.Desktop.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/"
      for png in data/icons/hicolor/*/apps/app.netaudio.Desktop.png; do
        size="$(basename "$(dirname "$(dirname "$png")")")"
        install -Dm644 "$png" "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/$size/apps/app.netaudio.Desktop.png"
      done
      install -m644 data/app.netaudio.Desktop.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/"

  netaudio-daemon:
    plugin: nil
    build-packages: [curl, python3]
    override-build: |
      set -eu
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) arch=x86_64;  sha=8cc38550bb338ee99261aa63e4689a397043c5962865440900a1af2630c74d64 ;;
        arm64) arch=aarch64; sha=7cde465a1771a94706eb89fc82e661a9a8994bc91b2b8f4cfa8ad92d9d911994 ;;
        *) echo "unsupported arch" >&2; exit 1 ;;
      esac
      curl -fsSL -o netaudio.whl \
        "https://github.com/chris-ritsen/network-audio-controller/releases/download/v0.6.1/netaudio-0.6.1-py3-none-manylinux_2_28_${arch}.whl"
      echo "$sha  netaudio.whl" | sha256sum -c -
      python3 -m zipfile -e netaudio.whl wheel
      install -Dm755 wheel/netaudio/bin/netaudio-daemon "$CRAFT_PART_INSTALL/usr/lib/netaudio/netaudio-daemon"
